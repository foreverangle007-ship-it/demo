<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>B6 配置圖｜方案 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<style>
:root{--bg:#f6f5f2;--panel:#fff;--ink:#1f2328;--mute:#6b7280;--line:#e5e2dc;--acc:#2f6f5e;--acc2:#e8f1ee;--warn:#c2410c;--bad:#b91c1c}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:"Noto Sans TC",system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:13px}
button,input,select,textarea{font:inherit;color:inherit}
header{height:52px;display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line);white-space:nowrap;overflow-x:auto}
header h1{font-size:15px;margin:0 8px 0 0;font-weight:700;letter-spacing:.02em}
.btn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:5px 10px;cursor:pointer;line-height:1.3}
.btn:hover{border-color:#c9c4ba;background:#faf9f7}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:#275e50}
.btn.on{background:var(--acc2);border-color:var(--acc);color:var(--acc);font-weight:600}
.btn.sm{padding:3px 7px;font-size:12px}
.btn.danger{color:var(--bad)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:#fff;padding:5px 12px;cursor:pointer}
.seg button.on{background:var(--acc);color:#fff}
select,input[type=text],input[type=number],textarea{border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:#fff}
input[type=number]{width:100%}
.sp{flex:1}
#status{font-size:12px;color:var(--mute);min-width:120px;text-align:right}
main{display:flex;height:calc(100% - 52px)}
aside{background:var(--panel);overflow:auto}
#pal{width:232px;border-right:1px solid var(--line);padding:10px}
#side{width:290px;border-left:1px solid var(--line);padding:12px}
#stage{flex:1;position:relative;overflow:hidden;background:#fbfaf8}
#cv{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
#three{position:absolute;inset:0;display:none;background:#eef0f2}
.cat{margin:10px 0 4px;font-weight:700;font-size:12px;color:var(--mute);display:flex;justify-content:space-between;cursor:pointer}
.pi{display:flex;align-items:center;gap:7px;padding:5px 6px;border-radius:6px;cursor:grab;border:1px solid transparent}
.pi:hover{background:#f4f2ee;border-color:var(--line)}
.pi i{width:14px;height:14px;border-radius:3px;flex:none;border:1.5px solid}
.pi b{font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis}
.pi small{color:var(--mute);font-size:11px}
#q{width:100%;margin-bottom:4px}
.tb{position:absolute;left:10px;top:10px;right:10px;display:flex;flex-wrap:wrap;gap:6px;z-index:5;pointer-events:none}.tb .grp{pointer-events:auto}
.tb .grp{background:#fff;border:1px solid var(--line);border-radius:9px;padding:5px;display:flex;flex-wrap:wrap;gap:4px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.legend{position:absolute;right:10px;bottom:10px;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:11px;color:var(--mute);z-index:5}
.legend span{display:inline-flex;align-items:center;gap:4px;margin-right:8px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
.hint{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;background:rgba(31,35,40,.85);color:#fff;padding:6px 12px;border-radius:999px;font-size:12px;z-index:6;pointer-events:none;opacity:0;transition:opacity .2s}
.field{display:grid;grid-template-columns:62px 1fr;align-items:center;gap:6px;margin:6px 0}
.field label{color:var(--mute);font-size:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.mini label{display:block;font-size:11px;color:var(--mute);margin-bottom:2px}
h3{font-size:13px;margin:14px 0 6px}
.sw{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.sw span{width:18px;height:18px;border-radius:4px;cursor:pointer;border:1px solid rgba(0,0,0,.1)}
.list .room{font-weight:700;color:var(--mute);font-size:12px;margin:10px 0 3px}
.li{display:flex;gap:6px;align-items:center;padding:4px 6px;border-radius:6px;cursor:pointer}
.li:hover{background:#f4f2ee}
.li.sel{background:var(--acc2)}
.li i{width:10px;height:10px;border-radius:2px;flex:none}
.li b{font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li small{color:var(--mute);font-size:11px;white-space:nowrap}
.help{color:var(--mute);font-size:12px;line-height:1.7}
.help kbd{background:#f1efea;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;font-size:11px;font-family:inherit}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:50}
.modal .box{background:#fff;border-radius:12px;padding:16px;width:min(640px,92vw);max-height:86vh;display:flex;flex-direction:column;gap:8px}
.modal textarea{width:100%;height:46vh;font-family:ui-monospace,monospace;font-size:11px}
.cust{border-top:1px solid var(--line);margin-top:12px;padding-top:8px}
.th3{position:absolute;left:10px;top:10px;z-index:5;background:#fff;border:1px solid var(--line);border-radius:9px;padding:6px;display:none;gap:6px;align-items:center;flex-wrap:wrap;max-width:calc(100% - 20px)}

<header>
  <h1>B6 配置規劃器</h1>
  <select id="schemeSel" title="切換方案"></select>

  <button class="btn sm" id="newScheme">＋ 新方案</button>
  <button class="btn sm" id="dupScheme">複製方案</button>
  <button class="btn sm danger" id="delScheme">刪除</button>
  <span class="sp"></span>
  <div class="seg"><button id="v2d" class="on">2D 平面</button><button id="v3d">3D 預覽</button></div>

<main>

      <div><label>深</label><input id="cD" type="number" value="40"></div>
      <div><label>高</label><input id="cH" type="number" value="90"></div>
      <div><label>離地</label><input id="cZ" type="number" value="0"></div>

    <div style="display:flex;gap:6px;margin-top:6px">
      <select id="cCat" style="flex:1"><option value="cab">木作櫃體</option><option value="furn">家具/家電</option><option value="zone">區塊</option></select>
      <button class="btn pri sm" id="cAdd">加入</button>
    </div>
  </div>
</aside>
<section id="stage">
  <svg id="cv" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <pattern id="hatchL" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#d9d6cf"></rect><line x1="0" y1="0" x2="0" y2="6" stroke="#a8a39a" stroke-width="1.2"></line></pattern>

  <div class="tb" id="tb2d">

      <button class="btn sm" id="zin">＋</button><button class="btn sm" id="zout">－</button><button class="btn sm" id="fit">全圖</button>
      <button class="btn sm" id="measure" title="點兩下量距離">📏 量距離</button>
    </div>
    <div class="grp">
      <button class="btn sm on" id="tSnap" title="移動時以 5 cm 為單位">格點 5cm</button>
      <button class="btn sm on" id="tWall" title="靠近牆或櫃體時自動貼齊">貼齊牆面</button>
      <button class="btn sm on" id="tDim">顯示淨距</button>
    </div>
    <div class="grp">
      <button class="btn sm on" id="tEquip">插座/燈/冷氣</button>
      <button class="btn sm on" id="tBeam">樑線</button>
      <button class="btn sm on" id="tWin">窗戶尺寸</button>
      <button class="btn sm on" id="tRdim">房間／門尺寸</button>
    </div>
  </div>
  <div class="th3" id="tb3d">
    <button class="btn sm" id="cam1">斜角</button><button class="btn sm" id="cam2">俯視</button>

    <span id="msg3" style="font-size:12px;color:var(--mute)"></span>
  </div>
  <div id="three"></div>
  <div class="legend" id="legend">

  </div>
  <div class="hint" id="hint"></div>
</section>
<aside id="side">

</aside>
</main>

</div></div>

// ---------- geometry helpers
const rad = d => d*Math.PI/180;
function aabb(it){
  const r = rad(it.rot||0), c = Math.abs(Math.cos(r)), s = Math.abs(Math.sin(r));
  const W = it.w*c + it.d*s, D = it.w*s + it.d*c;
  return [it.x-W/2, it.y-D/2, it.x+W/2, it.y+D/2];
}
function blocks(it){ return it.cat==='cab'||it.cat==='furn'; }
function obstacleSegs(ex){
  const out = G.segs;
  const extra = [];
  for(const o of items){
    if(o===ex || !blocks(o) || o.h<=2) continue;
    if(ex && blocks(ex)){
      const a0=ex.z||0, a1=a0+(ex.h||0), b0=o.z||0, b1=b0+(o.h||0);
      if(a1<=b0 || b1<=a0) continue; // different heights don't block each other
    }
    const [x1,y1,x2,y2] = aabb(o);
    extra.push([x1,y1,x2,y1],[x2,y1,x2,y2],[x2,y2,x1,y2],[x1,y2,x1,y1]);
  }
  return [out, extra];
}
function ray(ox,oy,dx,dy,lists,max=900){
  let best = max;
  for(const L of lists) for(const s of L){
    const ax=s[0], ay=s[1], ex=s[2]-ax, ey=s[3]-ay;
    const den = dx*ey - dy*ex; if(Math.abs(den)<1e-9) continue;
    const t = ((ax-ox)*ey - (ay-oy)*ex)/den;
    const u = ((ax-ox)*dy - (ay-oy)*dx)/den;
    if(t>0.05 && t<best && u>=-1e-6 && u<=1+1e-6) best = t;
  }
  return best;
}
function clearances(it){
  const [x1,y1,x2,y2] = aabb(it); const lists = obstacleSegs(it);
  const res = {};
  const side = (k, pts, dx, dy) => {
    let best = {t:1e9};
    for(const [px,py] of pts){ const t = ray(px,py,dx,dy,lists); if(t<best.t) best={t,px,py}; }
    res[k] = {...best, dx, dy};
  };
  const fx = f => x1+(x2-x1)*f, fy = f => y1+(y2-y1)*f, F=[0.04,0.5,0.96];
  side('L', F.map(f=>[x1,fy(f)]), -1,0); side('R', F.map(f=>[x2,fy(f)]), 1,0);
  side('T', F.map(f=>[fx(f),y1]), 0,-1); side('B', F.map(f=>[fx(f),y2]), 0,1);
  return res;
}
function wallSnap(it){
  const thr = Math.max(4, 10/view.s);
  const c = clearances(it);
  if(c.L.t<thr && c.L.t<=c.R.t) it.x -= c.L.t; else if(c.R.t<thr) it.x += c.R.t;
  if(c.T.t<thr && c.T.t<=c.B.t) it.y -= c.T.t; else if(c.B.t<thr) it.y += c.B.t;
}
function segCross(a,b){ // any wall between points
  const dx=b[0]-a[0], dy=b[1]-a[1], L=Math.hypot(dx,dy); if(L<1) return false;
  return ray(a[0],a[1],dx/L,dy/L,[G.segs],L) < L-0.5;
}
function guessRoom(it){
  let best=null, bd=1e9;
  for(const r of ROOMLAB){
    const d = Math.hypot(r.x+20-it.x, r.y-10-it.y);
    const pen = segCross([it.x,it.y],[r.x+20,r.y-10]) ? 400 : 0;
    if(d+pen<bd){bd=d+pen;best=r.t;}
  }
  return best||'其他';
}

    el('rect',{x:hx-6*k,y:hy-6*k,width:12*k,height:12*k,fill:'#fff',stroke:'#2f6f5e','stroke-width':2*k,'data-h':'size',style:'cursor:nwse-resize'},ovG);
    const [ax,ay] = L(0, -it.d/2 - 26*k); const [bx,by] = L(0,-it.d/2);
    el('line',{x1:bx,y1:by,x2:ax,y2:ay,stroke:'#2f6f5e','stroke-width':1.2*k},ovG);
    el('circle',{cx:ax,cy:ay,r:7*k,fill:'#fff',stroke:'#2f6f5e','stroke-width':2*k,'data-h':'rot',style:'cursor:grab'},ovG);
    if(opt.dim && it.cat!=='note'){
      const c = clearances(it);
      for(const key of ['L','R','T','B']){
        const q = c[key]; if(q.t>600) continue;
        const ex = q.px+q.dx*q.t, ey = q.py+q.dy*q.t;
        const colr = q.t<60?'#b91c1c':(q.t<80?'#c2410c':'#1d4ed8');
        el('line',{x1:q.px,y1:q.py,x2:ex,y2:ey,stroke:colr,'stroke-width':1.1*k,'stroke-dasharray':`${4*k} ${3*k}`},ovG);
        for(const [px,py] of [[q.px,q.py],[ex,ey]]) el('line',{x1:px-q.dy*5*k,y1:py-q.dx*5*k,x2:px+q.dy*5*k,y2:py+q.dx*5*k,stroke:colr,'stroke-width':1.4*k},ovG);
        const mx=(q.px+ex)/2, my=(q.py+ey)/2; const txt = fmt(r5(q.t));
        const tw = (txt.length*7+8)*k;
        el('rect',{x:mx-tw/2,y:my-9*k,width:tw,height:16*k,rx:4*k,fill:'#fff',stroke:colr,'stroke-width':0.8*k},ovG);
        const tt = el('text',{x:mx,y:my+3.5*k,'text-anchor':'middle','font-size':11*k,fill:colr,'font-weight':700},ovG); tt.textContent = txt;
      }
    }
  }
  if(meas.a){
    const b = meas.b || meas.hover; if(b){
      el('line',{x1:meas.a[0],y1:meas.a[1],x2:b[0],y2:b[1],stroke:'#7c3aed','stroke-width':1.6*k},ovG);
      const dd = Math.hypot(b[0]-meas.a[0], b[1]-meas.a[1]);
      const t = el('text',{x:(meas.a[0]+b[0])/2, y:(meas.a[1]+b[1])/2 - 6*k,'text-anchor':'middle','font-size':13*k,fill:'#7c3aed','font-weight':700,stroke:'#fff','stroke-width':3*k,'paint-order':'stroke'},ovG); t.textContent = fmt(r5(dd))+' cm';
    }
    for(const p of [meas.a, meas.b].filter(Boolean)) el('circle',{cx:p[0],cy:p[1],r:3.5*k,fill:'#7c3aed'},ovG);
  }
}

// ---------- edit ops
function pushHist(soft){ const s = JSON.stringify(items); if(hist[hist.length-1]===s) return; hist.push(s); if(hist.length>120) hist.shift(); fut=[]; }
function undo(){ if(!hist.length) return; fut.push(JSON.stringify(items)); items = JSON.parse(hist.pop()); if(!items.find(i=>i.id===sel)) sel=null; changed(); }
function redo(){ if(!fut.length) return; hist.push(JSON.stringify(items)); items = JSON.parse(fut.pop()); changed(); }
function rotSel(){ const it = items.find(i=>i.id===sel); if(!it) return; pushHist(); it.rot = ((it.rot||0)+90)%360; if(opt.wall) wallSnap(it); changed(); }
function dupSel(){ const it = items.find(i=>i.id===sel); if(!it) return; pushHist(); const n = {...it, id:uid(), x:it.x+20, y:it.y+20}; items.push(n); sel=n.id; changed(); }
function delSel(){ const i = items.findIndex(i=>i.id===sel); if(i<0) return; pushHist(); items.splice(i,1); sel=null; changed(); }
function changed(fromProps){
  drawItems(); renderList(); if(!fromProps) renderProps();
  else { const it = items.find(i=>i.id===sel); if(it){ const x=$('#pX'), y=$('#pY'); if(x && document.activeElement!==x) x.value=r5(it.x); if(y && document.activeElement!==y) y.value=r5(it.y);} }
  schemes[cur].items = items; schemes[cur].updatedAt = Date.now(); dirty.add(cur); lsSet(); queueSave();
  if(mode3d) build3dSoon();
}

// ---------- pointer interaction
let drag = null; const meas = {on:false, a:null, b:null, hover:null};
svg.addEventListener('pointerdown', e=>{
  if(e.button===2) return;
  const [wx,wy] = toWorld(e.clientX, e.clientY);
  const h = e.target.getAttribute && e.target.getAttribute('data-h');
  if(meas.on){ if(!meas.a || meas.b){ meas.a=[wx,wy]; meas.b=null; } else meas.b=[wx,wy]; drawOverlay(); return; }
  const it = items.find(i=>i.id===sel);
  if(h && it){ pushHist(); drag = {mode:h, it, sx:wx, sy:wy, o:{...it}}; svg.setPointerCapture(e.pointerId); return; }
  const g = e.target.closest && e.target.closest('.it');
  if(g){
    const t = items.find(i=>i.id===g.dataset.id); sel = t.id; pushHist();
    drag = {mode:'move', it:t, sx:wx, sy:wy, o:{...t}, moved:false};
    svg.setPointerCapture(e.pointerId); drawItems(); renderProps(); renderList(); return;
  }
  if(sel){ sel=null; drawItems(); renderProps(); renderList(); }
  drag = {mode:'pan', cx:e.clientX, cy:e.clientY, tx:view.tx, ty:view.ty}; svg.setPointerCapture(e.pointerId); svg.style.cursor='grabbing';
});
svg.addEventListener('pointermove', e=>{
  const [wx,wy] = toWorld(e.clientX, e.clientY);
  if(meas.on && meas.a && !meas.b){ meas.hover=[wx,wy]; drawOverlay(); }
  if(!drag) return;
  if(drag.mode==='pan'){ view.tx = drag.tx + e.clientX-drag.cx; view.ty = drag.ty + e.clientY-drag.cy; applyView(); return; }
  const it = drag.it, o = drag.o;
  if(drag.mode==='move'){
    let nx = o.x + (wx-drag.sx), ny = o.y + (wy-drag.sy);
    if(opt.snap && !e.altKey){ nx = Math.round(nx/5)*5; ny = Math.round(ny/5)*5; }
    it.x = nx; it.y = ny; if(opt.wall && !e.altKey) wallSnap(it); drag.moved = true;
  } else if(drag.mode==='size'){
    const r = rad(it.rot||0), cs=Math.cos(r), sn=Math.sin(r);
    const ax = o.x + (-o.w/2)*cs - (-o.d/2)*sn, ay = o.y + (-o.w/2)*sn + (-o.d/2)*cs; // fixed corner
    const lx = (wx-ax)*cs + (wy-ay)*sn, ly = -(wx-ax)*sn + (wy-ay)*cs;
    const st = opt.snap && !e.altKey ? 5 : 0.5;
    const nw = Math.max(st, Math.round(lx/st)*st), nd = Math.max(st, Math.round(ly/st)*st);
    it.w = nw; it.d = nd; it.x = ax + (nw/2)*cs - (nd/2)*sn; it.y = ay + (nw/2)*sn + (nd/2)*cs;
  } else if(drag.mode==='rot'){
    let a = Math.atan2(wy-it.y, wx-it.x)*180/Math.PI + 90; const st = e.shiftKey?1:15;
    it.rot = ((Math.round(a/st)*st)%360+360)%360;
  }
  drawItems(); if(drag.mode!=='move' || true) { const x=$('#pW'); if(x){ $('#pW').value=it.w; $('#pD').value=it.d; $('#pR').value=it.rot; $('#pX').value=r5(it.x); $('#pY').value=r5(it.y);} }
});
function endDrag(){
  if(!drag) return; svg.style.cursor='';
  if(drag.mode!=='pan'){ const it = drag.it; if(drag.mode==='move' && !drag.moved){ hist.pop(); } else { it.room = guessRoom(it); changed(); } }
  drag = null;
}
svg.addEventListener('pointerup', endDrag); svg.addEventListener('pointercancel', endDrag);
svg.addEventListener('wheel', e=>{ e.preventDefault(); zoomAt(Math.exp(-e.deltaY*0.0015), e.clientX, e.clientY); }, {passive:false});
svg.addEventListener('dragover', e=>{ e.preventDefault(); e.dataTransfer.dropEffect='copy'; });
svg.addEventListener('drop', e=>{ e.preventDefault(); try{ const a = JSON.parse(e.dataTransfer.getData('text/plain')); const [x,y] = toWorld(e.clientX,e.clientY); const it = presetToItem(a,x,y); if(opt.wall) wallSnap(it); addItem(it);}catch(err){} });
svg.addEventListener('contextmenu', e=>e.preventDefault());

document.addEventListener('keydown', e=>{
  const tag = (document.activeElement||{}).tagName; if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT') return;
  const mod = e.ctrlKey||e.metaKey;
  if(mod && e.key.toLowerCase()==='z'){ e.preventDefault(); e.shiftKey?redo():undo(); return; }
  if(mod && e.key.toLowerCase()==='y'){ e.preventDefault(); redo(); return; }
  if(mod && e.key.toLowerCase()==='d'){ e.preventDefault(); dupSel(); return; }
  if(e.key==='Escape'){ sel=null; meas.on=false; meas.a=meas.b=null; $('#measure').classList.remove('on'); drawItems(); renderProps(); renderList(); return; }
  const it = items.find(i=>i.id===sel); if(!it) return;
  if(e.key==='Delete'||e.key==='Backspace'){ e.preventDefault(); delSel(); }
  else if(e.key==='r'||e.key==='R'){ rotSel(); }
  else if(e.key.startsWith('Arrow')){ e.preventDefault(); const s = e.shiftKey?10:1; if(!e.repeat) pushHist();
    if(e.key==='ArrowLeft') it.x-=s; if(e.key==='ArrowRight') it.x+=s; if(e.key==='ArrowUp') it.y-=s; if(e.key==='ArrowDown') it.y+=s; changed(true); }
});

const esc = v => String(v??'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function exportData(){ return {app:'B6 配置規劃器', version:1, scheme:schemes[cur].name, exportedAt:new Date().toISOString(), unit:'cm', origin:'平面圖左上角牆角，x 向右、y 向下；x,y 為物件中心；rot 為順時針角度；櫃體正面在旋轉前的下方', items}; }
function stamp(){ const d=new Date(), p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`; }
function safeName(n){ return (n||'方案').replace(/[\\/:*?"<>|\s]+/g,'_').slice(0,60); }
function planSVG(){
  const keepSel = sel, keepMeas = {...meas}; sel = null; meas.a = meas.b = meas.hover = null; drawItems();
  let x1=-45, y1=-30, x2=1020, y2=990;
  for(const it of items){ const b = aabb(it); x1=Math.min(x1,b[0]-20); y1=Math.min(y1,b[1]-20); x2=Math.max(x2,b[2]+20); y2=Math.max(y2,b[3]+20); }
  const w=x2-x1, h=y2-y1;
  const out = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${x1} ${y1} ${w} ${h}" width="100%" style="max-width:${Math.round(w*1.4)}px;display:block;margin:auto"><defs>${document.querySelector('#cv defs').innerHTML}</defs><style>text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}</style><rect x="${x1}" y="${y1}" width="${w}" height="${h}" fill="#fff"/>${bgG.outerHTML}${itG.outerHTML}</svg>`;
  sel = keepSel; Object.assign(meas, keepMeas); drawItems();
  return out;
}
function exportHTML(){
  const data = exportData(); const name = schemes[cur].name;
  const json = JSON.stringify(data).replace(/</g,'\\u003c');
  const head = BOOT_HEAD.replace(/<title>[\s\S]*?<\/title>/, `<title>B6 配置圖｜${esc(name)}</title>`);
  return `<!DOCTYPE html>\n<html lang="zh-Hant"><head>${head}</head><body>${'<scr'+'ipt type="application/json" id="b6-data">'}${json}${'</scr'+'ipt>'}${BOOT_BODY}</body></html>`;
}
let dlNS; async function dlCap(){ if(dlNS!==undefined) return dlNS; try{ dlNS = window.claude&&window.claude.use ? await window.claude.use('downloads') : null; }catch(e){ dlNS=null; } return dlNS; }
async function saveFile(filename, data){
  const msg = $('#dlMsg'); const d = await dlCap();
  if(!d && !(window.claude&&window.claude.use)){
    try{ const blob = new Blob([data], {type: filename.endsWith('.json')?'application/json':'text/html'}); const u = URL.createObjectURL(blob); const a = document.createElement('a'); a.href=u; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u), 4000); msg.textContent=`已下載 ${filename}`; msg.style.color='#2f6f5e'; return; }catch(e){}
  }
  if(!d){ msg.innerHTML = '這個畫面不能直接下載。JSON 可以展開下方內容複製；或在 claude.ai 打開這個頁面再試。'; msg.style.color='#b91c1c'; return; }
  try{ await d.save({filename, data}); msg.textContent = `已下載 ${filename}`; msg.style.color='#2f6f5e'; }
  catch(e){ const c = e&&e.code; msg.style.color='#b91c1c';
    msg.textContent = c==='declined' ? '已取消下載' : c==='rate_limited' ? '已經有一個下載確認視窗，請先處理它' : c==='too_large' ? '檔案太大' : '下載失敗，請改用下方複製 JSON'; }
}
$('#exportBtn').onclick=()=>{ $('#mText').value = JSON.stringify(exportData(), null, 1); $('#dlMsg').style.color=''; $('#modal').style.display='flex'; };
$('#dlHtml').onclick=()=>saveFile(`B6配置圖_${safeName(schemes[cur].name)}_${stamp()}.html`, exportHTML());
$('#dlJson').onclick=()=>saveFile(`B6配置_${safeName(schemes[cur].name)}_${stamp()}.json`, JSON.stringify(exportData(), null, 1));
$('#mClose').onclick=()=>$('#modal').style.display='none';
$('#mCopy').onclick=async()=>{ try{ await navigator.clipboard.writeText($('#mText').value); flash('已複製'); }catch(e){ $('#mText').select(); flash('請按 Ctrl+C 複製'); } };
function cleanItems(arr){ return arr.map(i=>({id:uid(), name:String(i.name||'項目').slice(0,80), cat:['cab','furn','zone','note'].includes(i.cat)?i.cat:'cab', w:+i.w||50, d:+i.d||50, h:+i.h||0, z:+i.z||0, x:+i.x||0, y:+i.y||0, rot:+i.rot||0, color:/^#[0-9a-f]{3,8}$/i.test(i.color)?i.color:'#7c6f5b', door:String(i.door||''), note:String(i.note||''), room:ROOMS.includes(i.room)?i.room:'', shape:['bed','circle','L'].includes(i.shape)?i.shape:undefined})); }
function parseImport(text){
  const m = text.match(/<script[^>]*id="b6-data"[^>]*>([\s\S]*?)<\/script>/);
  const j = JSON.parse(m ? m[1] : text); const arr = Array.isArray(j)?j:j.items; if(!Array.isArray(arr)) throw new Error('no items');
  return {name: (j.scheme ? String(j.scheme) : '匯入方案'), items: cleanItems(arr)};
}
$('#mApply').onclick=()=>{ try{ const r = parseImport($('#mText').value); pushHist(); items = r.items; sel=null; changed(); $('#modal').style.display='none'; flash('已套用到目前方案'); }catch(e){ flash('JSON 格式不對，沒有套用'); } };
$('#fileIn').addEventListener('change', async e=>{
  const f = e.target.files[0]; e.target.value=''; if(!f) return;
  try{ const r = parseImport(await f.text()); newScheme(r.name+'（匯入）', r.items); $('#modal').style.display='none'; flash(`已匯入 ${r.items.length} 項為新方案`); }
  catch(err){ const m=$('#dlMsg'); m.textContent='這個檔案讀不到配置資料（要是本工具匯出的 .json 或 .html）'; m.style.color='#b91c1c'; }
});

// ---------- saving
function setStatus(t, c){ const s=$('#status'); s.textContent=t; s.style.color=c||''; }
function queueSave(){ clearTimeout(saveTimer); if(!db){ setStatus(cloudOK===false&&dbTried?'只存在這個瀏覽器':'已暫存'); return; } setStatus('未儲存…'); saveTimer=setTimeout(flush, 1200); }
async function flush(){
  if(!db || saving) return; if(!dirty.size){ return; }
  saving = true; setStatus('儲存中…');
  try{
    for(const id of [...dirty]){
      dirty.delete(id); const s = schemes[id]; if(!s) continue;
      await db.collection('layouts').doc(id).set({name:s.name, items:s.items, created:s.created||Date.now(), updatedAt:s.updatedAt||Date.now(), unit:'cm'});
    }
    lastSaved = new Date(); cloudOK = true;
    setStatus('已儲存 ' + lastSaved.toTimeString().slice(0,5), '#2f6f5e');
  }catch(e){
    setStatus(e && e.code==='quota_exceeded' ? '雲端空間已滿' : '雲端儲存失敗，已存在瀏覽器', '#b91c1c');
    if(e && e.code==='invalid_argument'){ db=null; }
  }
  saving=false; if(dirty.size) saveTimer=setTimeout(flush, 800);
}
let dbTried=false;
async function initDb(){
  for(let i=0;i<30 && !(window.claude&&window.claude.use);i++) await new Promise(r=>setTimeout(r,100));
  try{ db = window.claude&&window.claude.use ? await window.claude.use('db') : null; }catch(e){ db=null; }
  dbTried = true;
  if(!db){ cloudOK=false; setStatus('只存在這個瀏覽器'); return; }
  let timer = setTimeout(()=>setStatus('連不上雲端，先存在瀏覽器','#c2410c'), 10000);
  try{
    const snap = await db.collection('layouts').get(); clearTimeout(timer);
    if(snap.empty){ Object.keys(schemes).forEach(id=>dirty.add(id)); flush(); }
    else {
      const remote = {}; snap.docs.forEach(d=>{ const v=d.data(); if(v && Array.isArray(v.items)) remote[d.id] = {name:String(v.name||'方案'), items:JSON.parse(JSON.stringify(v.items)), created:v.created, updatedAt:v.updatedAt}; });
      for(const [id,v] of Object.entries(remote)){ if(!schemes[id] || (v.updatedAt||0) >= (schemes[id].updatedAt||0)) schemes[id]=v; else dirty.add(id); }
      for(const id of Object.keys(schemes)) if(!remote[id] && schemes[id].items.length) dirty.add(id); else if(!remote[id]) delete schemes[id];
      if(!Object.keys(schemes).length) schemes = remote;
      const latest = Object.entries(schemes).sort((a,b)=>(b[1].updatedAt||0)-(a[1].updatedAt||0))[0][0];
      switchScheme(schemes[cur]?cur:latest);
      if(dirty.size) flush(); else setStatus('已同步', '#2f6f5e');
    }
  }catch(e){ clearTimeout(timer); setStatus('雲端讀取失敗，先存在瀏覽器','#c2410c'); }
}

// ---------- 3D
let mode3d=false, T=null, R3=null, b3timer=null;
function build3dSoon(){ clearTimeout(b3timer); b3timer=setTimeout(build3d, 250); }
function parsePolys(paths){ const res=[]; for(const d of paths){ const pts=[...d.matchAll(/(-?[\d.]+),(-?[\d.]+)/g)].map(m=>[+m[1],+m[2]]); if(pts.length>2) res.push(pts);} return res; }
async function init3d(){
  if(T) return true;
  $('#msg3').textContent='載入 3D…';
  try{
    const THREE = await import('three'); const {OrbitControls} = await import('three/addons/controls/OrbitControls.js');
    T = THREE; const box = $('#three');
    const ren = new THREE.WebGLRenderer({antialias:true}); ren.setPixelRatio(Math.min(2, devicePixelRatio)); ren.shadowMap.enabled = true; box.appendChild(ren.domElement);
    const scene = new THREE.Scene(); scene.background = new THREE.Color('#eef0f2');
    const cam = new THREE.PerspectiveCamera(45, 1, 5, 8000);
    const ctl = new OrbitControls(cam, ren.domElement); ctl.target.set(480,0,500); ctl.enableDamping = true; ctl.maxPolarAngle = Math.PI*0.495;
    scene.add(new THREE.HemisphereLight(0xffffff, 0xb8b0a0, 1.6));
    const sun = new THREE.DirectionalLight(0xffffff, 1.3); sun.position.set(900,1400,300); sun.target.position.set(480,0,500); sun.castShadow=true;
    Object.assign(sun.shadow.camera,{left:-800,right:800,top:800,bottom:-800,near:100,far:4000}); sun.shadow.mapSize.set(2048,2048); scene.add(sun, sun.target);
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(1600,1600), new THREE.MeshStandardMaterial({color:'#dfe3e6', roughness:1}));
    ground.rotation.x = -Math.PI/2; ground.position.set(481,-3,495); ground.receiveShadow = true; scene.add(ground);
    const fsh = new THREE.Shape(FLOOR_POLY.map(([x,y])=>new THREE.Vector2(x,-y)));
    const floor = new THREE.Mesh(new THREE.ShapeGeometry(fsh), new THREE.MeshStandardMaterial({color:'#e2cfb0', roughness:.85}));
    floor.rotation.x = -Math.PI/2; floor.receiveShadow = true; scene.add(floor);
    for(const [x1,y1,x2,y2] of TILES){ const t = new THREE.Mesh(new THREE.PlaneGeometry(x2-x1,y2-y1), new THREE.MeshStandardMaterial({color:'#c9cbc8', roughness:.9})); t.rotation.x=-Math.PI/2; t.position.set((x1+x2)/2,0.3,(y1+y2)/2); t.receiveShadow=true; scene.add(t); }
    const dyn = new THREE.Group(); scene.add(dyn);
    R3 = {ren, scene, cam, ctl, dyn, box};
    const resize = ()=>{ const r = box.getBoundingClientRect(); if(!r.width) return; ren.setSize(r.width, r.height); cam.aspect = r.width/r.height; cam.updateProjectionMatrix(); };
    new ResizeObserver(resize).observe(box); resize();
    camPreset(1);
    const loop = ()=>{ requestAnimationFrame(loop); if(mode3d){ ctl.update(); ren.render(scene, cam);} }; loop();
    $('#msg3').textContent='拖曳旋轉・右鍵平移・滾輪縮放';
    return true;
  }catch(e){ $('#msg3').textContent='3D 載入失敗：'+(e.message||e); return false; }
}
function camPreset(n){ if(!R3) return; const {cam, ctl} = R3; if(n===1){ cam.position.set(1150, 1050, 1350); } else { cam.position.set(481, 1500, 500.1); } ctl.target.set(481,0,495); ctl.update(); }
function labelSprite(text){
  const c = document.createElement('canvas'); const x = c.getContext('2d'); const fs=40; x.font = `600 ${fs}px "Noto Sans TC",sans-serif`;
  const w = Math.ceil(x.measureText(text).width)+28; c.width=w; c.height=fs+22; x.font = `600 ${fs}px "Noto Sans TC",sans-serif`;
  x.fillStyle='rgba(255,255,255,.88)'; x.beginPath(); x.roundRect(0,0,w,c.height,14); x.fill(); x.fillStyle='#1f2328'; x.textBaseline='middle'; x.fillText(text,14,c.height/2+2);
  const tex = new T.CanvasTexture(c); tex.colorSpace = T.SRGBColorSpace; const s = new T.Sprite(new T.SpriteMaterial({map:tex, depthTest:false}));
  s.scale.set(w/3.2, c.height/3.2, 1); s.renderOrder = 10; return s;
}
function build3d(){
  if(!T || !R3) return; const {dyn} = R3; const THREE=T;
  while(dyn.children.length){ const o = dyn.children.pop(); o.traverse(m=>{ m.geometry&&m.geometry.dispose(); if(m.material){ (m.material.map&&m.material.map.dispose()); m.material.dispose(); } }); }
  const H = +$('#wallH').value;
  if(H>0){
    const mats = [new THREE.MeshStandardMaterial({color:'#f4f3ef', roughness:.95}), new THREE.MeshStandardMaterial({color:'#e3e0d8', roughness:.95})];
    [[G.solid,0],[G.light,1]].forEach(([paths,mi])=>{
      for(const poly of parsePolys(paths)){
        const sh = new THREE.Shape(poly.map(([x,y])=>new THREE.Vector2(x,-y)));
        const g = new THREE.ExtrudeGeometry(sh,{depth:H, bevelEnabled:false}); g.rotateX(-Math.PI/2);
        const m = new THREE.Mesh(g, mats[mi]); m.castShadow = m.receiveShadow = true; dyn.add(m);
      }
    });
  }
  const boxAt = (x1,y1,x2,y2,z0,z1,mat,shadow=true)=>{ if(z1-z0<=0.1) return; const m = new THREE.Mesh(new THREE.BoxGeometry(x2-x1, z1-z0, y2-y1), mat); m.position.set((x1+x2)/2,(z0+z1)/2,(y1+y2)/2); m.castShadow=shadow; m.receiveShadow=true; dyn.add(m); return m; };
  const wallM = new THREE.MeshStandardMaterial({color:'#f4f3ef', roughness:.95});
  const glassM = new THREE.MeshStandardMaterial({color:'#9cc3d8', transparent:true, opacity:.35, roughness:.1, metalness:.1, depthWrite:false});
  const frameM = new THREE.MeshStandardMaterial({color:'#5b6168', roughness:.5});
  const doorM = new THREE.MeshStandardMaterial({color:'#7a5c3e', roughness:.6});
  for(const [x1,y1,x2,y2,sill,top,kind] of OPEN3){
    const vert = (x2-x1) < (y2-y1);
    if(H>top) boxAt(x1,y1,x2,y2,top,H,wallM);
    if(kind==='glass'){
      if(sill>0) boxAt(x1,y1,x2,y2,0,Math.min(sill,H),wallM);
      if(H>sill){ const t2=Math.min(top,H);
        const cx=(x1+x2)/2, cy=(y1+y2)/2;
        if(vert){ boxAt(cx-1,y1,cx+1,y2,sill,t2,glassM,false); boxAt(cx-3,y1,cx+3,y1+4,sill,t2,frameM); boxAt(cx-3,y2-4,cx+3,y2,sill,t2,frameM); boxAt(cx-3,(y1+y2)/2-2,cx+3,(y1+y2)/2+2,sill,t2,frameM); }
        else { boxAt(x1,cy-1,x2,cy+1,sill,t2,glassM,false); boxAt(x1,cy-3,x1+4,cy+3,sill,t2,frameM); boxAt(x2-4,cy-3,x2,cy+3,sill,t2,frameM); boxAt((x1+x2)/2-2,cy-3,(x1+x2)/2+2,cy+3,sill,t2,frameM); }
        boxAt(vert?cx-3:x1, vert?y1:cy-3, vert?cx+3:x2, vert?y2:cy+3, sill, sill+3, frameM);
        if(t2===top) boxAt(vert?cx-3:x1, vert?y1:cy-3, vert?cx+3:x2, vert?y2:cy+3, top-3, top, frameM);
      }
    } else if(kind==='entry' && H>0){ const cx=(x1+x2)/2; boxAt(cx-2.5,y1+5,cx+2.5,y2-5,0,Math.min(top,H),doorM); }
  }
  const railM = new THREE.MeshStandardMaterial({color:'#9aa1a8', roughness:.4, metalness:.4});
  for(const [x1,y1,x2,y2,h] of RAILS){
    const vert = (x2-x1) < (y2-y1), cx=(x1+x2)/2, cy=(y1+y2)/2;
    if(vert){ boxAt(cx-1,y1,cx+1,y2,8,h-5,glassM,false); boxAt(cx-3,y1,cx+3,y2,h-5,h,railM); boxAt(x1,y1,x2,y2,0,8,wallM); }
    else { boxAt(x1,cy-1,x2,cy+1,8,h-5,glassM,false); boxAt(x1,cy-3,x2,cy+3,h-5,h,railM); boxAt(x1,y1,x2,y2,0,8,wallM); }
  }
  for(const [x1,y1,x2,y2,h] of CURBS) boxAt(x1,y1,x2,y2,0,h,wallM);
  for(const it of items){
    if(it.cat==='note') continue;
    const zone = it.cat==='zone'; const h = zone?0.6:Math.max(0.6, it.h||1); const z = zone?0.2:(it.z||0);
    const col = new THREE.Color(it.color);
    const mat = zone ? new THREE.MeshBasicMaterial({color:col, transparent:true, opacity:.28, depthWrite:false})
      : new THREE.MeshStandardMaterial({color: it.cat==='cab'? col.clone().lerp(new THREE.Color('#ffffff'),.35) : col.clone().lerp(new THREE.Color('#ffffff'),.5), roughness:.7});
    const grp = new THREE.Group(); grp.position.set(it.x, 0, it.y); grp.rotation.y = -rad(it.rot||0);
    let geo;
    if(it.shape==='circle'){ geo = new THREE.CylinderGeometry(it.w/2, it.w/2, h, 40); }
    else geo = new THREE.BoxGeometry(it.w, h, it.d);
    const m = new THREE.Mesh(geo, mat); m.position.y = z + h/2; m.castShadow = !zone; m.receiveShadow = true; grp.add(m);
    if(!zone){ const e = new THREE.LineSegments(new THREE.EdgesGeometry(geo), new THREE.LineBasicMaterial({color: col.clone().multiplyScalar(.6)})); e.position.copy(m.position); grp.add(e); }
    if(it.cat==='cab' && !zone){ const f = new THREE.Mesh(new THREE.BoxGeometry(it.w*0.98, h*0.96, 0.6), new THREE.MeshStandardMaterial({color:col, roughness:.6})); f.position.set(0, z+h/2, it.d/2+0.31); grp.add(f); }
    if(it.shape==='bed'){ const mt = new THREE.Mesh(new THREE.BoxGeometry(it.w-4, 18, it.d-4), new THREE.MeshStandardMaterial({color:'#ffffff', roughness:.9})); mt.position.y = h+9; grp.add(mt); }
    dyn.add(grp);
    if(opt.lab3){ const s = labelSprite(it.name); s.position.set(it.x, z+h+(zone?10:18), it.y); dyn.add(s); }
  }
}
async function setMode(three){
  mode3d = three; $('#v2d').classList.toggle('on',!three); $('#v3d').classList.toggle('on',three);
  $('#three').style.display = three?'block':'none'; $('#tb3d').style.display = three?'flex':'none';
  $('#tb2d').style.display = three?'none':'flex'; $('#legend').style.display = three?'none':'';
  if(three){ if(await init3d()) build3d(); }
}
$('#v2d').onclick=()=>setMode(false); $('#v3d').onclick=()=>setMode(true);
$('#cam1').onclick=()=>camPreset(1); $('#cam2').onclick=()=>camPreset(2);
$('#wallH').addEventListener('input', e=>{ $('#wallHv').textContent=e.target.value; build3dSoon(); });
$('#t3lab').onclick=()=>{ opt.lab3=!opt.lab3; $('#t3lab').classList.toggle('on',opt.lab3); build3d(); };

// ---------- boot
const saved = lsGet();
if(EMBED && !(saved && saved.schemes && Object.keys(saved.schemes).length)){
  const id='f1'; schemes[id] = {name:String(EMBED.scheme||'匯入方案'), items:cleanItems(EMBED.items||[]), created:Date.now(), updatedAt:Date.now()}; cur=id;
} else if(saved && saved.schemes && Object.keys(saved.schemes).length){ schemes = saved.schemes; cur = saved.schemes[saved.cur] ? saved.cur : Object.keys(saved.schemes)[0]; }
else { const id='s'+Date.now().toString(36); schemes[id] = {name:'方案 1', items:[], created:Date.now(), updatedAt:0}; cur=id; }
items = schemes[cur].items;
drawBg(); renderPalette(); renderSchemes(); drawItems(); renderProps(); renderList();
requestAnimationFrame(fit); new ResizeObserver(()=>{ if(!drag) applyView(); }).observe(svg);
let fitted=false; new ResizeObserver(()=>{ if(!fitted){ fitted=true; fit(); } }).observe($('#stage'));
if(EMBED){ document.querySelector('header h1').innerHTML = 'B6 配置圖 <small style="font-weight:400;color:#6b7280;font-size:12px">匯出檔・'+esc(new Date(EMBED.exportedAt||Date.now()).toLocaleString('zh-TW',{hour12:false}))+'</small>'; setStatus('離線檔案・改動存在這個瀏覽器'); }
else { setStatus('連線中…'); initDb(); }
